title = "Gitleaks classroom rules"

[extend]
useDefault = true

[[rules]]
id = "classroom-aws-example"
description = "Published AWS example used in the classroom"
path = '''(^|/)config\.py$'''
regex = '''(?m)^AWS_ACCESS_KEY_ID\s*=\s*"(AKIAIOSFODNN7EXAMPLE)"'''
secretGroup = 1
[[rules]]
id = "rafi-cloud-key"
description = "Detect fictional Rafi Cloud credentials"
path = '''(^|/)config\.py$'''
regex = '''\bRAFI-CLOUD-[0-9]{7}\b'''
